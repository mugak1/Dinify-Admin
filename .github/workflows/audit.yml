name: Dependency Audit

# A SCHEDULED RE-SCAN of main, using the SAME evaluator and policy as the required
# check. Since D08 B2.1 the audit is enforced inside `validate` (ci.yml) on every pull
# request and every push to main; this workflow exists because advisories are published
# between merges, so a clean scan last week says nothing about today.
#
# It is not a required check and it deploys nothing: deploy.yml triggers on the
# workflow named "CI" and re-verifies that the triggering run is .github/workflows/ci.yml,
# so a green run of THIS workflow cannot stand in for complete application validation.
# A failure (blocking findings, or a scan that could not complete) fires GitHub's
# scheduled-workflow notification.
on:
  schedule:
    - cron: '30 6 * * 1'   # Mondays 06:30 UTC (09:30 EAT)
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit — snapshot the installed inventory
        run: npm run audit:snapshot

      - name: Dependency audit — scan and enforce the policy
        run: npm run audit:deps

      - name: Retain the dependency-audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: dependency-audit/evidence/
          if-no-files-found: warn
          retention-days: 30
