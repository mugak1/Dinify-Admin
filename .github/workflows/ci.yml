name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      # Pinned to the same reviewed commits deploy.yml uses: since D08 B2.4 this job is
      # the one that builds, checks and retains the bytes a deployment promotes.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      # NOTE: plain `npm ci`. Dinify-Frontend passes `--legacy-peer-deps`; that flag is
      # NOT carried over, and its absence is deliberate rather than an oversight. A
      # clean install of this dependency set resolves with no peer conflicts, and so
      # does the sibling's own today — the flag there is a historical artefact. See
      # CLAUDE.md. There is no `overrides` block either: the sibling's four entries
      # exist for firebase-tools / gaxios / ng2-charts transitives, none of which are
      # dependencies here.
      - name: Install dependencies
        run: npm ci

      # DEPENDENCY AUDIT, part 1 of 2 (D08 B2.1 — dependency-audit/README.md). Taken
      # IMMEDIATELY after installation, before any repository code runs: it records the
      # exact lock graph and installed tree this job validates, and refuses if the tree
      # is not the lock graph. Offline. The scan at the end of this job is bound to it.
      - name: Dependency audit — snapshot the installed inventory
        run: npm run audit:snapshot

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      # The design-token gate (ADMIN-TOKENS-00), BEFORE the suite so a token
      # regression fails fast. `--self-test` runs first: a matcher that silently
      # stopped matching would otherwise pass everything forever, and "the tree is
      # clean today" is not evidence that a gate works. This is what keeps the §16
      # brand-red review a one-line change instead of a sweep.
      - name: Design-token gate
        run: npm run check:tokens

      # The claim-code gate (ADMIN-CLAIM-CODE-00), also before the suite. A raw owner
      # claim code is a bearer credential the server returns once and keeps only as a
      # hash; this fails the build if any production statement or template tag writes
      # one to storage, a log, a URL, router state, the workspace store, a canonical
      # model, or assembles a claim link. `--self-test` runs first, for the same reason
      # as above.
      - name: Claim-code gate
        run: npm run check:claim-code

      # The dependency-audit evaluator's own regression matrix — offline and
      # deterministic, fixtures only. Proves the policy can pass AND refuse; it does not
      # scan anything and is not a substitute for the scan at the end of this job.
      - name: Dependency-audit evaluator tests
        run: npm run test:audit

      # The standing guards' own qualification (B2.3), before the long suite so a broken
      # detector fails fast. Proves the mock-isolation gate can find what it claims to:
      # its CLI and package script executed against a disposable workspace, the source
      # boundary against every development-only module, output coverage against missing,
      # empty, partial, unreadable and linked outputs, and — in
      # scripts/tests/mock-isolation.build.test.mjs — REAL optimized production builds
      # of deliberately broken copies of this app. Offline; builds nothing into dist/.
      - name: Guard qualification tests
        run: npm run test:guards

      # The release-certification contract's own regression matrix (D08 B2.4) — offline:
      # the candidate, assessment and admission records, the archive, the tree digest the
      # host recomputes, and the embedded remote procedure run against a model host.
      - name: Release-contract tests
        run: npm run test:release

      - name: Test
        run: npm run test:ci

      # RELEASE CERTIFICATION, part 1 of 3 (D08 B2.4 — release/README.md). There must be no
      # build output yet, and the installed inventory must still be the audit snapshot, so
      # the output the next step produces is this job's, built from that inventory.
      - name: Release certification — assert a clean build from the snapshotted inventory
        run: npm run release:prebuild

      - name: Build (production)
        run: npm run build:prod

      # Must run AFTER build:prod — it scans the built output. The package script runs
      # the gate's --self-test FIRST and the real scan only if it passes. Fails (1) if
      # development-only code — the mock transports, their fixtures or the primitives
      # gallery — is in the production module graph or the build output, and (2) is
      # INCOMPLETE, never clean, if the output is missing, empty, partial or unreadable.
      # A mock authenticator shipped to the control plane is an authentication bypass
      # with a friendly name.
      - name: Mock-isolation gate
        run: npm run check:mock-isolation

      # RELEASE CERTIFICATION, part 2 of 3: record the tree digest of EXACTLY the output the
      # mock-isolation gate just scanned. The candidate must still be that tree.
      - name: Release certification — freeze the scanned output
        run: npm run release:freeze

      # DEPENDENCY AUDIT, part 2 of 2 — part of THIS required check, not a separate one.
      # Scans the snapshotted inventory (and the pinned scanner's own graph) against the
      # public advisory database and enforces the policy: a high/critical finding
      # anywhere, or any finding on a runtime (non-dev) package, fails `validate`; so does a scan
      # that could not complete — a timeout, an error body, an unparseable or empty
      # report, or an inventory that moved since the snapshot is never read as clean.
      # Placed LAST so the application gates above still report when only the audit
      # fails. No `if:`, no `continue-on-error`, no pipe: its exit status is the step's.
      - name: Dependency audit — scan the validated inventory and enforce the policy
        run: npm run audit:deps

      # RELEASE CERTIFICATION, part 3 of 3: only a job in which EVERY gate above passed
      # reaches this step (no `if:`, no `continue-on-error`). It proves the output is still
      # the frozen tree, the inventory still the snapshot and the audit evidence this
      # checkout's, passing and reproducible, then writes the candidate: the payload
      # archive, the certification record, and the dependency evidence BESIDE (never
      # inside) the served payload. A pull-request candidate is produced the same way and
      # is never promotable: deploy.yml accepts only a push to main.
      - name: Release certification — certify and package the candidate
        run: npm run release:certify

      # The candidate, named by THIS run and attempt, so a deployment can select exactly
      # it by id and digest. Uploaded only on success — it is certification, not evidence.
      - name: Retain the certified candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: admin-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/.work/candidate/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 90 || 7 }}
          # The payload is already gzipped and the evidence is small text.
          compression-level: 6

      # The complete raw scanner output, the inventory and the decision, kept whether the
      # job passed or not. `always()` here only retains evidence; it cannot turn a failed
      # step green.
      - name: Retain the dependency-audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: dependency-audit/evidence/
          if-no-files-found: warn
          retention-days: 30
